<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti ❤️ - Universo Infinito</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #020005;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        /* CANVAS DE FONDO: CAMPO DENSO DE ESTRELLAS Y GALAXIA */
        #starfield-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background: radial-gradient(circle at center, #110026 0%, #05000d 70%, #020005 100%);
        }

        /* CANVAS PARA EFECTO DE EXPLOSIÓN GALÁCTICA */
        #explosion-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 92%;
            max-width: 480px;
            text-align: center;
            transition: opacity 0.8s ease, transform 0.8s ease;
            z-index: 10;
        }

        .hidden {
            display: none !important;
            opacity: 0;
        }

        /* TÍTULOS CON BRILLO DORADO ESPACIAL */
        h2 {
            font-family: 'Cinzel', serif;
            background: linear-gradient(180deg, #ffffff 0%, #f7e092 50%, #cca340 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
            letter-spacing: 3px;
            font-size: 1.5rem;
            text-transform: uppercase;
            filter: drop-shadow(0 0 15px rgba(247, 224, 146, 0.8));
            font-weight: 800;
        }

        p {
            color: #e3d2ff;
            font-size: 0.85rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }

        /* TARJETA DEL PIN - CON BORDES E ILUMINACIÓN MORADA */
        .card {
            background: rgba(18, 5, 36, 0.75);
            border: 1.5px solid rgba(168, 85, 247, 0.8);
            border-radius: 24px;
            padding: 30px 20px;
            width: 100%;
            box-shadow: 0 0 50px rgba(168, 85, 247, 0.6), inset 0 0 25px rgba(168, 85, 247, 0.3);
            backdrop-filter: blur(15px);
        }

        .lock-icon {
            font-size: 2.2rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 12px #ffd700);
        }

        .pin-display {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 20px 0 25px 0;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1.5px solid #f7e092;
            transition: all 0.3s;
        }

        .dot.active {
            background: #f7e092;
            box-shadow: 0 0 15px #f7e092, 0 0 25px #ffffff;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            max-width: 260px;
            margin: 0 auto;
        }

        .keypad button {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(168, 85, 247, 0.7);
            color: #fff;
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            height: 54px;
            width: 54px;
            border-radius: 50%;
            cursor: pointer;
            justify-self: center;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
        }

        .keypad button:active {
            background: rgba(168, 85, 247, 0.5);
            transform: scale(0.9);
            box-shadow: 0 0 20px #a855f7;
        }

        /* CONTADOR HORIZONTAL CON RESPLANDOR MORADO */
        .timer {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            margin: 10px 0 30px 0;
            width: 100%;
        }

        .time-box {
            flex: 1;
            background: rgba(18, 5, 36, 0.75);
            border: 1.5px solid rgba(168, 85, 247, 0.8);
            padding: 12px 2px;
            border-radius: 14px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.6), inset 0 0 15px rgba(168, 85, 247, 0.3);
            backdrop-filter: blur(12px);
        }

        .time-box span {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            display: block;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.9), 0 0 22px rgba(247, 224, 146, 0.8);
            line-height: 1;
            margin-bottom: 6px;
        }

        .time-box p {
            font-size: 0.55rem;
            margin-bottom: 0;
            color: #f7e092;
            letter-spacing: 1px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* BOTONES DE NAVEGACIÓN CON BORDES MORADOS */
        .nav-buttons {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        .btn-action, .btn-back {
            flex: 1;
            background: rgba(18, 5, 36, 0.85);
            border: 1.5px solid rgba(168, 85, 247, 0.8);
            color: #f7e092;
            padding: 12px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 2px;
            transition: all 0.3s;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.5);
        }

        .btn-action:hover, .btn-back:hover {
            background: #f7e092;
            color: #030008;
            border-color: #f7e092;
            box-shadow: 0 0 35px rgba(247, 224, 146, 0.9);
        }

        /* CARRUSEL 3D CON MARCOS Y SOMBRA MORADA */
        .carousel-container {
            width: 100%;
            height: 290px;
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0 25px 0;
        }

        .carousel {
            width: 160px;
            height: 220px;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateCarousel 16s infinite linear;
        }

        .carousel:hover {
            animation-play-state: paused;
        }

        .card-3d {
            position: absolute;
            width: 160px;
            height: 220px;
            left: 0;
            top: 0;
            border-radius: 16px;
            overflow: hidden;
            border: 1.5px solid rgba(168, 85, 247, 0.9);
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.75), inset 0 0 15px rgba(168, 85, 247, 0.35);
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-3d img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
        }

        .card-3d:nth-child(1) { transform: rotateY(0deg) translateZ(190px); }
        .card-3d:nth-child(2) { transform: rotateY(120deg) translateZ(190px); }
        .card-3d:nth-child(3) { transform: rotateY(240deg) translateZ(190px); }

        @keyframes rotateCarousel {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        /* CARTA CON ILUMINACIÓN MORADA */
        .letter-card {
            background: rgba(18, 5, 36, 0.85);
            border: 1.5px solid rgba(168, 85, 247, 0.8);
            padding: 28px 22px;
            border-radius: 20px;
            width: 100%;
            min-height: 230px;
            text-align: left;
            margin-bottom: 25px;
            box-shadow: 0 0 45px rgba(168, 85, 247, 0.65), inset 0 0 20px rgba(168, 85, 247, 0.35);
            backdrop-filter: blur(12px);
        }

        #typed-text {
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.7;
            font-size: 0.92rem;
            color: #f5e8ff;
            margin-bottom: 0;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <canvas id="starfield-canvas"></canvas>
    
    <canvas id="explosion-canvas"></canvas>

    <div id="pin-screen" class="screen">
        <div class="card">
            <div class="lock-icon">🔒</div>
            <h2>FELIZ ANIVERSARIO</h2>
            <p>Ingresa nuestra fecha</p>
            <div class="pin-display">
                <span class="dot"></span><span class="dot"></span>
                <span class="dot"></span><span class="dot"></span>
                <span class="dot"></span><span class="dot"></span>
            </div>
            <div class="keypad">
                <button onclick="pressKey('1')">1</button>
                <button onclick="pressKey('2')">2</button>
                <button onclick="pressKey('3')">3</button>
                <button onclick="pressKey('4')">4</button>
                <button onclick="pressKey('5')">5</button>
                <button onclick="pressKey('6')">6</button>
                <button onclick="pressKey('7')">7</button>
                <button onclick="pressKey('8')">8</button>
                <button onclick="pressKey('9')">9</button>
                <button onclick="clearPin()">C</button>
                <button onclick="pressKey('0')">0</button>
                <button onclick="deleteKey()">⌫</button>
            </div>
        </div>
    </div>

    <div id="main-screen" class="screen hidden">
        <h2>NUESTRO TIEMPO JUNTOS</h2>
        <div class="timer">
            <div class="time-box"><span id="years">0</span><p>Años</p></div>
            <div class="time-box"><span id="months">0</span><p>Meses</p></div>
            <div class="time-box"><span id="days">0</span><p>Días</p></div>
            <div class="time-box"><span id="hours">0</span><p>Horas</p></div>
            <div class="time-box"><span id="minutes">0</span><p>Min</p></div>
            <div class="time-box"><span id="seconds">0</span><p>Seg</p></div>
        </div>
        <div class="nav-buttons">
            <button class="btn-action" onclick="showScreen('gallery-screen')">VER RECUERDOS</button>
            <button class="btn-action" onclick="showScreen('letter-screen')">LEER CARTA</button>
        </div>
    </div>

    <div id="gallery-screen" class="screen hidden">
        <h2>RECUERDOS</h2>
        <div class="carousel-container">
            <div class="carousel">
                <div class="card-3d"><img id="img1" alt="Foto 1"></div>
                <div class="card-3d"><img id="img2" alt="Foto 2"></div>
                <div class="card-3d"><img id="img3" alt="Foto 3"></div>
            </div>
        </div>
        <button class="btn-back" onclick="showScreen('main-screen')">VOLVER</button>
    </div>

    <div id="letter-screen" class="screen hidden">
        <div class="letter-card">
            <p id="typed-text"></p>
        </div>
        <button class="btn-back" onclick="showScreen('main-screen')">VOLVER</button>
    </div>

    <script>
        const CORRECT_PIN = "011219";
        const START_DATE = new Date("2019-12-01T20:27:00");

        const img1Source = "https://images.weserv.nl/?url=drive.google.com/uc?id=14BbfB11emO2XcBKEzF-oIgiWqlTAppUT";
        const img2Source = "https://images.weserv.nl/?url=drive.google.com/uc?id=19GJ2BNgAfRhexCNTVhGr_BmLNCiD0mtk";
        const img3Source = "https://images.weserv.nl/?url=drive.google.com/uc?id=1Rw2UZGpGA_4VQnScv0u85T8RVk4XGhqu";

        let currentPin = "";
        let timerInterval = null;
        let typeInterval = null;

        /* GENERADOR Y ANIMACIÓN EN MOVIMIENTO DEL UNIVERSO EN CANVAS */
        const starCanvas = document.getElementById('starfield-canvas');
        const starCtx = starCanvas.getContext('2d');
        let stars = [];
        const STAR_COUNT = 600;
        let nebulaAngle = 0;

        function resizeStarfield() {
            starCanvas.width = window.innerWidth;
            starCanvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            const colors = ['#ffffff', '#ffd700', '#f7e092', '#e3d2ff', '#ffb6c1'];
            const centerX = starCanvas.width / 2;
            const centerY = starCanvas.height / 2;

            for (let i = 0; i < STAR_COUNT; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * Math.max(starCanvas.width, starCanvas.height);
                stars.push({
                    x: centerX + Math.cos(angle) * distance,
                    y: centerY + Math.sin(angle) * distance,
                    z: Math.random() * starCanvas.width,
                    angle: angle,
                    speed: Math.random() * 0.8 + 0.3,
                    radius: Math.random() * 1.8 + 0.2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: Math.random(),
                    twinkleSpeed: Math.random() * 0.02 + 0.005,
                    direction: Math.random() > 0.5 ? 1 : -1
                });
            }
        }

        function drawStarfield() {
            starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);

            const centerX = starCanvas.width / 2;
            const centerY = starCanvas.height / 2;

            nebulaAngle += 0.002;
            
            const n1X = centerX + Math.cos(nebulaAngle) * 100;
            const n1Y = centerY + Math.sin(nebulaAngle) * 80;
            const grad1 = starCtx.createRadialGradient(n1X, n1Y, 10, n1X, n1Y, starCanvas.width * 0.55);
            grad1.addColorStop(0, 'rgba(120, 20, 180, 0.3)');
            grad1.addColorStop(1, 'transparent');
            starCtx.fillStyle = grad1;
            starCtx.fillRect(0, 0, starCanvas.width, starCanvas.height);

            const n2X = centerX + Math.cos(-nebulaAngle * 1.2) * 120;
            const n2Y = centerY + Math.sin(-nebulaAngle * 1.2) * 90;
            const grad2 = starCtx.createRadialGradient(n2X, n2Y, 10, n2X, n2Y, starCanvas.width * 0.5);
            grad2.addColorStop(0, 'rgba(255, 90, 160, 0.22)');
            grad2.addColorStop(1, 'transparent');
            starCtx.fillStyle = grad2;
            starCtx.fillRect(0, 0, starCanvas.width, starCanvas.height);

            stars.forEach(s => {
                s.x += Math.cos(s.angle) * s.speed;
                s.y += Math.sin(s.angle) * s.speed;

                s.alpha += s.twinkleSpeed * s.direction;
                if (s.alpha >= 1 || s.alpha <= 0.1) {
                    s.direction *= -1;
                }

                if (s.x < 0 || s.x > starCanvas.width || s.y < 0 || s.y > starCanvas.height) {
                    s.angle = Math.random() * Math.PI * 2;
                    s.x = centerX + Math.cos(s.angle) * 5;
                    s.y = centerY + Math.sin(s.angle) * 5;
                }

                starCtx.save();
                starCtx.globalAlpha = Math.max(0, Math.min(1, s.alpha));
                starCtx.beginPath();
                starCtx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                starCtx.fillStyle = s.color;
                if (s.radius > 1.2) {
                    starCtx.shadowColor = s.color;
                    starCtx.shadowBlur = 8;
                }
                starCtx.fill();
                starCtx.restore();
            });

            requestAnimationFrame(drawStarfield);
        }

        window.addEventListener('resize', resizeStarfield);
        resizeStarfield();
        drawStarfield();

        function loadProtectedImages() {
            document.getElementById('img1').src = img1Source;
            document.getElementById('img2').src = img2Source;
            document.getElementById('img3').src = img3Source;
        }

        function pressKey(num) {
            if (currentPin.length < 6) {
                currentPin += num;
                updateDots();
                if (currentPin.length === 6) {
                    setTimeout(checkPin, 100);
                }
            }
        }

        function clearPin() {
            currentPin = "";
            updateDots();
        }

        function deleteKey() {
            currentPin = currentPin.slice(0, -1);
            updateDots();
        }

        function updateDots() {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, index) => {
                if (index < currentPin.length) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        function checkPin() {
            if (currentPin === CORRECT_PIN) {
                triggerGalaxyExplosion(() => {
                    loadProtectedImages();
                    showScreen('main-screen');
                    startTimer();
                });
            } else {
                alert("Clave incorrecta. Inténtalo de nuevo.");
                clearPin();
            }
        }

        /* ANIMACIÓN DE EXPLOSIÓN GALÁCTICA */
        function triggerGalaxyExplosion(callback) {
            const canvas = document.getElementById('explosion-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const particleCount = 400;
            const colors = ['#ffd700', '#f7e092', '#ff77a9', '#a259ff', '#ffffff', '#70a1ff'];

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 16 + 3;
                particles.push({
                    x: centerX,
                    y: centerY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 3.5 + 1,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: Math.random() * 0.012 + 0.006
                });
            }

            let animationId;
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                let alive = false;
                particles.forEach(p => {
                    if (p.alpha > 0) {
                        alive = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.alpha -= p.decay;

                        ctx.save();
                        ctx.globalAlpha = Math.max(0, p.alpha);
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.shadowColor = p.color;
                        ctx.shadowBlur = 14;
                        ctx.fill();
                        ctx.restore();
                    }
                });

                if (alive) {
                    animationId = requestAnimationFrame(animate);
                } else {
                    cancelAnimationFrame(animationId);
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }

            document.getElementById('pin-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('pin-screen').classList.add('hidden');
                document.getElementById('pin-screen').style.opacity = '1';
                callback();
            }, 600);

            animate();
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
            
            if (screenId === 'letter-screen') {
                typeLetter();
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            
            function update() {
                const now = new Date();
                const diff = now - START_DATE;

                const seconds = Math.floor((diff / 1000) % 60);
                const minutes = Math.floor((diff / (1000 * 60)) % 60);
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const days = Math.floor((diff / (1000 * 60 * 60 * 24)) % 30.4375);
                const months = Math.floor((diff / (1000 * 60 * 60 * 24 * 30.4375)) % 12);
                const years = Math.floor(diff / (1000 * 60 * 60 * 24 * 365.25));

                document.getElementById('years').innerText = years;
                document.getElementById('months').innerText = months;
                document.getElementById('days').innerText = days;
                document.getElementById('hours').innerText = hours;
                document.getElementById('minutes').innerText = minutes;
                document.getElementById('seconds').innerText = seconds;
            }
            
            update();
            timerInterval = setInterval(update, 1000);
        }

        /* TEXTO DE LA CARTA PERSONALIZADO Y CON EMOJIS */
        const letterText = "Amor de mi Vida,\n\nGracias por ser el refugio de mi vida, por cada instante, cada risa y hasta por los silencios que hemos compartido. 🫂✨\n\nEres el núcleo de mi universo. Quiero que sepas que hoy y siempre serás mi lugar favorito en el mundo. 🌌✨ Quiero que sigamos construyendo nuestro hogar pasito a pasito y eso sí, siempre de la mano de Dios. 🙏🏼🏡✨\n\nHoy celebro por un mes más, por todo lo que hemos vivido en esta vida y por todas las vidas que nos faltan. 🥂❤️\n\nTe Amooo Infinitamente ❤️♾️\n\n#01 L&J 🤍\n¡CÓMPLICES! 🔐✨";

        function typeLetter() {
            let index = 0;
            const el = document.getElementById('typed-text');
            el.innerText = "";
            if (typeInterval) clearInterval(typeInterval);

            typeInterval = setInterval(() => {
                if (index < letterText.length) {
                    el.innerText += letterText.charAt(index);
                    index++;
                } else {
                    clearInterval(typeInterval);
                }
            }, 35);
        }
    </script>
</body>
</html>
